<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%23131619'/%3E%3Cpath d='M16.88 7.31 L18.5 8.25 V15.75 L12 19.5 L5.5 15.75 V8.25 L12 4.5 L14.25 5.63' fill='none' stroke='rgba(255,255,255,.85)' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='15.6' cy='6.5' r='1.8' fill='%2382dd2d'/%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kintsugi</title>
  <script>
    // 在样式加载前写入外观，避免深色模式首屏闪白
    try {
      var saved = JSON.parse(localStorage.getItem('scaffold.appearance') || '{}')
      var theme = saved.theme === 'dark' || (saved.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'
      document.documentElement.dataset.theme = theme
      document.documentElement.dataset.density = saved.density || 'regular'
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
